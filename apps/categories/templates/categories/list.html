{% extends "base.html" %}
{% load static %}

{% block titulo %}Categorías — Diantú{% endblock %}

{% block contenido %}
<div class="page-header">
    <h1>Categorías</h1>
</div>

<!--
    Clases nuevas usadas aquí (aún no existen en components/card.css, se construyen después):
    .category-card         → contenedor, fondo teñido al 10% con var(--cat-color)
    .category-icon-circle  → círculo relleno de color, ícono blanco adentro
-->
<div class="category-list">
    {% for category in categories %}
    <div class="category-card" style="--cat-color: {{ category.color }};">
        <div class="category-card-info">
            <span class="category-icon-circle">
                <i class="ti {{ category.icon }}" aria-hidden="true"></i>
            </span>
            <span class="category-name">{{ category.name }}</span>
        </div>
    </div>
    {% empty %}
    <p class="empty-state">Aún no tienes categorías.</p>
    {% endfor %}
</div>
{% endblock %}
